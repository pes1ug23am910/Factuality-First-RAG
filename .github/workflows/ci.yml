name: Model-offline CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Python 3.10 model-offline quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and bounded development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check repository
        run: python -m mypy factuality_rag scripts

      - name: Run offline tests with branch coverage
        run: python -m pytest --cov=factuality_rag --cov-report=term-missing

      - name: Smoke-test CLI discovery
        run: python -m factuality_rag.cli --help

      - name: Collect real-model tests without executing them
        run: python -m pytest -m integration --collect-only -q
