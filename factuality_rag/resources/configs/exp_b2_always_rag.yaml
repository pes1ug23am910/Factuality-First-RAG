# ──────────────────────────────────────────────────────────────
# Baseline B2 — Always-RAG (retrieve for every query)
# ──────────────────────────────────────────────────────────────

seed: 42

models:
  dense_embedder: "sentence-transformers/all-mpnet-base-v2"
  nli_verifier: "ynie/roberta-large-snli_mnli_fever_anli_R1_R2_R3-nli"
  generator: "mistralai/Mistral-7B-Instruct-v0.3"

data:
  datasets:
    - name: "natural_questions"
      split: "validation"
  dev_sample_size: 500

# Disable gating — always retrieve
gating:
  enabled: false

index:
  faiss_out: "indexes/wiki100k.faiss"
  corpus_path: "data/wiki_100000_chunks.jsonl"
  pyserini_out: "indexes/wiki100k_lucene"

retriever:
  alpha: 0.6
  normalize: true
  top_k: 10
  rerank: true

scorer:
  enabled: false  # conventional Always-RAG: pass every retrieved passage

pipeline:
  mock_mode: false
  runs_dir: "runs"

eval:
  metrics:
    - exact_match
    - f1
    - lexical_support
