# ──────────────────────────────────────────────────────────────
# Baseline B3 — Gate-Only (gating + retrieval, NO passage scoring)
# ──────────────────────────────────────────────────────────────

seed: 42

models:
  dense_embedder: "sentence-transformers/all-mpnet-base-v2"
  nli_verifier: "ynie/roberta-large-snli_mnli_fever_anli_R1_R2_R3-nli"
  generator: "mistralai/Mistral-7B-Instruct-v0.3"

data:
  datasets:
    - name: "natural_questions"
      split: "validation"
  dev_sample_size: 500

# Gating enabled — adaptive retrieval
gating:
  enabled: true
  entropy_thresh: 1.2
  logit_gap_thresh: 2.0
  probe_tokens: 1
  softmax_temperature: 1.0  # fixed/unfitted; not evidence of calibration

index:
  faiss_out: "indexes/wiki100k.faiss"
  corpus_path: "data/wiki_100000_chunks.jsonl"
  pyserini_out: "indexes/wiki100k_lucene"

retriever:
  alpha: 0.6
  normalize: true
  top_k: 10
  rerank: true

# Scorer bypassed — accept ALL retrieved passages without NLI work or filtering
scorer:
  enabled: false

pipeline:
  mock_mode: false
  runs_dir: "runs"

eval:
  metrics:
    - exact_match
    - f1
    - lexical_support
