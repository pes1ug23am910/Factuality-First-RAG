[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factuality_rag"
version = "0.4.0"
description = "Factuality-first RAG: adaptive retrieval gating and passage-level evidence scoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Yash Verma"}]
keywords = ["rag", "factuality", "retrieval", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "datasets>=2.0",
    "transformers>=4.57,<5",
    "sentence-transformers",
    "faiss-cpu",
    "pyserini==1.2.0",
    "pyjnius==1.7.0",
    "scikit-learn",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "wheel>=0.45,<1",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "coverage[toml]>=7.5,<7.11",
    "ruff>=0.9,<0.16",
    "mypy>=1.11,<1.19",
    "types-PyYAML>=6.0.12,<7",
]
quantization = [
    "bitsandbytes==0.49.2",
    "accelerate==1.14.0",
]

[project.scripts]
factuality-rag = "factuality_rag.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factuality_rag*"]

[tool.setuptools.package-data]
"factuality_rag.resources" = ["configs/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: requires real models or GPU; run explicitly with '-m integration'",
]

[tool.coverage.run]
branch = true
source = ["factuality_rag"]

[tool.coverage.report]
# This initial floor covers the offline scientific and reproducibility paths while
# real-model and hardware-only branches remain isolated in the integration suite.
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
